<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .bmi-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        button:hover {
            background: #3182ce;
        }

        .result {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: #f8f9fa;
            display: none;
        }

        .result h2 {
            color: #2d3748;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .bmi-value {
            font-size: 36px;
            font-weight: 700;
            margin: 10px 0;
        }

        .category {
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        /* BMI 分类样式 */
        .underweight { background: #e5f0ff; color: #4299e1; }
        .normal { background: #e6fffa; color: #38b2ac; }
        .overweight { background: #fffaf0; color: #ed8936; }
        .obese { background: #fed7d7; color: #e53e3e; }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .bmi-container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .bmi-value {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="bmi-container">
        <h1>BMI 身体质量指数计算器</h1>
        
        <div class="input-group">
            <label for="height">身高 (厘米)</label>
            <input type="number" id="height" placeholder="请输入身高，例如：175" min="50" max="250">
        </div>

        <div class="input-group">
            <label for="weight">体重 (公斤)</label>
            <input type="number" id="weight" placeholder="请输入体重，例如：70" min="10" max="300" step="0.1">
        </div>

        <button onclick="calculateBMI()">计算 BMI</button>

        <div class="result" id="result">
            <h2>你的 BMI 结果</h2>
            <div class="bmi-value" id="bmiValue">0.00</div>
            <div class="category" id="category">未计算</div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // 获取输入值
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');
            const resultDiv = document.getElementById('result');
            const bmiValueDiv = document.getElementById('bmiValue');
            const categoryDiv = document.getElementById('category');

            // 验证输入
            const height = parseFloat(heightInput.value);
            const weight = parseFloat(weightInput.value);

            if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
                alert('请输入有效的身高和体重数值！');
                return;
            }

            // 计算 BMI (BMI = 体重(kg) / (身高(m))²)
            const heightInMeters = height / 100;
            const bmi = weight / (heightInMeters * heightInMeters);
            const bmiRounded = bmi.toFixed(2);

            // 确定 BMI 分类
            let category = '';
            let categoryClass = '';

            if (bmi < 18.5) {
                category = '偏瘦';
                categoryClass = 'underweight';
            } else if (bmi >= 18.5 && bmi < 24) {
                category = '正常';
                categoryClass = 'normal';
            } else if (bmi >= 24 && bmi < 28) {
                category = '超重';
                categoryClass = 'overweight';
            } else {
                category = '肥胖';
                categoryClass = 'obese';
            }

            // 更新结果显示
            bmiValueDiv.textContent = bmiRounded;
            categoryDiv.textContent = category;
            categoryDiv.className = `category ${categoryClass}`;
            resultDiv.style.display = 'block';

            // 滚动到结果区域
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // 按回车键触发计算
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateBMI();
            }
        });
    </script>
</body>
</html>
